name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Cache des PairCache ausfuehren
        run: gradle cacheSelfTest --no-daemon

      - name: JAR bauen
        run: gradle build --no-daemon

      - name: Inhalt der JAR pruefen
        run: gradle -I check_jar.gradle checkJar --no-daemon

      - name: JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vanillaboost-lab-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
